name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test ./...
      - run: scripts/release.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
