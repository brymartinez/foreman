triage_dir: ~/.local/share/foreman/triage
tasks_dir: ~/.local/share/foreman/tasks
worktrees_dir: ~/.local/share/foreman/worktrees
repositories_dir: ~/.local/share/foreman/repositories
log_dir: ~/.local/share/foreman/logs
review_rounds: 1
skip_self_review: false
fix_rounds: 3
refresh: 60
mentions: false
default_source: github
budgets:
  task_tokens: 2000000
  planning_tokens: 400000
  call_timeout_seconds: 1800
  implementer_usd: 25
  reviewer_usd: 10
notifications:
  enabled: true
  webhook_url: ""
# These targets select the model and provider for each task stage. Self-review
# uses the implementation target, so changing one setting changes both calls.
models:
  planning:
    agent: claude
    model: claude-opus-5-5
    reasoning_effort: medium
  implementation:
    agent: claude
    model: claude-sonnet-5
    reasoning_effort: medium
  adversarial_review:
    agent: codex
    model: gpt-6.1-sol
    reasoning_effort: medium
claude:
  command: claude
  model: claude-sonnet-5 # standalone knowledge commands
  plan_model: claude-opus-5-5
  review_model: claude-sonnet-5
codex:
  command: codex
  model: gpt-6.1-sol # standalone knowledge commands
  plan_model: gpt-6-luna
  review_model: gpt-6.1-sol
  reasoning_effort: medium
  plan_reasoning_effort: xhigh
  review_reasoning_effort: medium
cleanup:
  on_done: true
  delete_merged_branch: true
exclude_repositories: []
include_repositories: []
linear_team: ""
